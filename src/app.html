<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F7F5F0">
<title>Lógica — Raciocínio lógico para concursos</title>
<meta name="description" content="Treine raciocínio lógico para concursos com fases curtas e questões no estilo das bancas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lógica">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5F0; --card:#FFFFFF; --ink:#26241F; --muted:#6F6A62; --line:#E7E2D8; --line2:#D9D3C7; --tint:#EFECE6;
    --ok:#2E7A4E; --ok-l:#E4F2E9; --no:#B0473A; --no-l:#F7E4E0;
    --accent:#4A4740; --accent-d:#2E2C27; --soft:#EEEBE5; --mbody:#BDB7AC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:#ECE8E0;color:var(--ink);font-family:Nunito,system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh}
  #app{width:100%;max-width:560px;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 0 1px var(--line)}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
  h1,h2,h3,.logo,.disp{font-family:"Baloo 2",Nunito,sans-serif}
  .screen{animation:in .28s ease;padding-bottom:110px}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ----- mascote ----- */
  .msvg{width:100%;height:100%;overflow:visible}
  .msvg .whole{transform-origin:60px 110px}
  .mood-idle .whole,.mood-welcome .whole,.mood-encourage .whole{animation:bob 3s ease-in-out infinite}
  .mood-happy .whole{animation:hop .55s ease 2}
  .mood-sad .whole,.mood-oops .whole{animation:wobble .7s ease 1}
  .mood-thinking .whole{animation:tilt 3.2s ease-in-out infinite}
  .mood-surprised .whole{animation:pop .45s ease 1}
  .floaty.mood-idle .whole,.floaty.mood-welcome .whole{animation:float 3.4s ease-in-out infinite}
  .orb{animation:twinkle 2.2s ease-in-out infinite}
  .dots circle{animation:twinkle 1.4s ease-in-out infinite}
  .dots circle:nth-child(2){animation-delay:.2s}.dots circle:nth-child(3){animation-delay:.4s}
  .mood-excited .whole{animation:jump .5s ease 3}
  .mood-celebrate .whole{animation:party 1s ease 2}
  .mood-idle .eye,.mood-welcome .eye,.mood-encourage .eye{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
  .arm-wave{animation:wave .9s ease-in-out infinite}
  .spark{animation:twinkle 1s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-4px)}}
  @keyframes float{50%{transform:translateY(-8px)}}
  @keyframes tilt{50%{transform:rotate(-4deg)}}
  @keyframes pop{40%{transform:scale(1.12)}}
  @keyframes hop{40%{transform:translateY(-14px) scale(1.03,.97)}}
  @keyframes wobble{20%{transform:rotate(-8deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
  @keyframes jump{50%{transform:translateY(-18px)}}
  @keyframes party{30%{transform:translateY(-16px) rotate(-8deg)}60%{transform:translateY(-16px) rotate(8deg)}}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  @keyframes wave{50%{transform:rotate(-22deg)}}
  @keyframes twinkle{50%{opacity:.3}}
  @media (prefers-reduced-motion:reduce){.msvg *{animation:none!important}}
  .mbox{flex:none}
  .bubble{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px;position:relative;font-weight:800;line-height:1.3}
  .bubble small{display:block;font-weight:700;color:var(--muted);font-size:13px;margin-top:2px}
  .bubble.left::before{content:"";position:absolute;left:-9px;top:22px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}

  /* ----- topo ----- */
  .appbar{display:flex;align-items:center;gap:8px;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:6;border-bottom:2px solid var(--line)}
  .logo{font-weight:800;font-size:28px;flex:1;line-height:1}
  .logo span{color:var(--accent)}
  .logo small{display:block;font-family:Nunito,sans-serif;font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--accent);margin-top:2px}
  .brand{text-align:center;margin:0 0 10px}
  /* comemoração de sequência */
  .streak-ov{position:fixed;inset:0;z-index:80;overflow-y:auto;background:radial-gradient(ellipse at 50% 30%,#FFE8C7 0%,var(--bg) 62%);animation:in .35s ease}
  .streak-ov.out{opacity:0;transition:opacity .3s}
  .streak-ov .sbox{position:relative;z-index:2;max-width:440px;margin:0 auto;padding:26px 20px 30px;text-align:center}
  .streak-ov h2{font-size:34px;margin:2px 0 0;line-height:1.05}
  .flame{position:relative;display:inline-block;margin:0 0 14px;animation:flicker 1.3s ease-in-out infinite;transform-origin:50% 90%}
  .flame .f{font-size:88px;display:block;line-height:1;filter:drop-shadow(0 6px 14px rgba(255,120,30,.45))}
  .flame .num{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);font-family:"Baloo 2";font-size:34px;color:#fff;text-shadow:0 2px 0 #B4441A,0 0 8px rgba(0,0,0,.25)}
  .flame .num.bump{animation:numpop .5s ease}
  @keyframes numpop{40%{transform:translate(-50%,-50%) scale(1.6)}}
  @keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.07,1.12) rotate(2deg)}}
  .streak-ov .act{width:150px;height:150px;margin:6px auto 0}
  /* comemoração do 🔥: o mascote se mexe por partes (braços, pés, rabo, antena), sem girar a imagem inteira */
  .act .msvg .whole{animation:none;transform-origin:80px 150px}
  .act .p-foot{transform-box:fill-box;transform-origin:50% 100%}
  .act .shadow{transform-box:fill-box;transform-origin:center}
  .sp-dino .p-tail{transform-origin:114px 108px} .sp-foxy .p-tail{transform-origin:104px 128px}
  .sp-miko .p-tail{transform-origin:106px 134px} .sp-roki .p-tail{transform-origin:52px 125px}
  .sp-lumi .p-ant{transform-origin:80px 32px}
  /* Dino: marcha pisando forte, um pé de cada vez, socando o ar */
  .act-stomp .msvg .whole{animation:march .8s ease-in-out infinite}
  .act-stomp .p-foot{animation:stepup .8s ease-in-out infinite} .act-stomp .p-foot.pf1{animation-delay:-.4s}
  .act-stomp .arm-l{animation:pumpL .4s ease-in-out infinite alternate} .act-stomp .arm-r{animation:pumpR .4s ease-in-out infinite alternate-reverse}
  .act-stomp .p-tail{animation:tailwag .8s ease-in-out infinite}
  .act-stomp .shadow{animation:thud .4s ease-in-out infinite}
  @keyframes march{0%,50%,100%{transform:translateY(1px) rotate(0)}25%{transform:translateY(-4px) rotate(-3deg)}75%{transform:translateY(-4px) rotate(3deg)}}
  @keyframes stepup{0%,50%,100%{transform:translateY(0)}22%{transform:translateY(-11px) rotate(-8deg)}}
  @keyframes pumpL{from{transform:rotate(-22deg)}to{transform:rotate(14deg)}}
  @keyframes pumpR{from{transform:rotate(22deg)}to{transform:rotate(-14deg)}}
  @keyframes tailwag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
  @keyframes thud{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.88)}}
  /* Lumi: flutua brilhando, rege o ar com os bracinhos e balança a antena */
  .act-glow{animation:glow 1.6s ease-in-out infinite}
  @keyframes glow{50%{filter:drop-shadow(0 0 18px rgba(255,214,120,.95))}}
  .act-glow .msvg .whole{animation:float 2s ease-in-out infinite}
  .act-glow .arm-l{animation:conductL 1s ease-in-out infinite alternate} .act-glow .arm-r{animation:conductR 1s ease-in-out infinite alternate-reverse}
  .act-glow .p-ant{animation:antenna 1s ease-in-out infinite alternate}
  .act-glow .shadow{animation:shadowfloat 2s ease-in-out infinite}
  @keyframes conductL{from{transform:rotate(-40deg)}to{transform:rotate(18deg)}}
  @keyframes conductR{from{transform:rotate(40deg)}to{transform:rotate(-18deg)}}
  @keyframes antenna{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}
  @keyframes shadowfloat{50%{transform:scale(.8);opacity:.06}}
  /* Foxy: pulinhos abanando o rabo e acenando */
  .act-wag .msvg .whole{animation:foxhop .6s ease-in-out infinite}
  .act-wag .p-tail{animation:wagfast .2s ease-in-out infinite alternate}
  .act-wag .arm-r{animation:hello .5s ease-in-out infinite alternate} .act-wag .arm-l{animation:pumpL .6s ease-in-out infinite alternate}
  .act-wag .p-foot{animation:tiptoe .6s ease-in-out infinite}
  .act-wag .shadow{animation:shadowhop .6s ease-in-out infinite}
  @keyframes foxhop{0%,100%{transform:translateY(0) scale(1)}15%{transform:scale(1.05,.95)}45%{transform:translateY(-13px) scale(.97,1.04)}75%{transform:translateY(0) scale(1.04,.96)}}
  @keyframes wagfast{from{transform:rotate(-16deg)}to{transform:rotate(10deg)}}
  @keyframes hello{from{transform:rotate(-30deg)}to{transform:rotate(16deg)}}
  @keyframes tiptoe{0%,100%{transform:none}45%{transform:translateY(-2px) rotate(-6deg)}}
  @keyframes shadowhop{45%{transform:scale(.72);opacity:.07}}
  /* Miko: agacha, pega impulso e salta de braços pro alto */
  .act-jump .msvg .whole{animation:leap 1s ease-in-out infinite}
  .act-jump .arm-l{animation:leapL 1s ease-in-out infinite} .act-jump .arm-r{animation:leapR 1s ease-in-out infinite}
  .act-jump .p-foot{animation:tuck 1s ease-in-out infinite}
  .act-jump .p-tail{animation:tailflip 1s ease-in-out infinite}
  .act-jump .shadow{animation:shadowleap 1s ease-in-out infinite}
  @keyframes leap{0%,100%{transform:none}22%{transform:scale(1.07,.88)}48%,58%{transform:translateY(-20px) scale(.95,1.07)}80%{transform:scale(1.06,.92)}}
  @keyframes leapL{0%,100%{transform:rotate(0)}22%{transform:rotate(-60deg)}50%{transform:rotate(14deg)}80%{transform:rotate(-30deg)}}
  @keyframes leapR{0%,100%{transform:rotate(0)}22%{transform:rotate(60deg)}50%{transform:rotate(-14deg)}80%{transform:rotate(30deg)}}
  @keyframes tuck{0%,30%,75%,100%{transform:none}50%{transform:translateY(-5px)}}
  @keyframes tailflip{0%,30%,80%,100%{transform:rotate(0)}52%{transform:rotate(18deg)}}
  @keyframes shadowleap{0%,100%{transform:none}22%{transform:scaleX(1.1)}50%{transform:scale(.55);opacity:.05}}
  /* Bloop: sapo pulando na lagoa, esticando as pernas e batendo os bracinhos */
  .act-boing .msvg .whole{animation:frog .9s ease-in-out infinite}
  .act-boing .arm-l{animation:flapL .3s ease-in-out infinite alternate} .act-boing .arm-r{animation:flapR .3s ease-in-out infinite alternate}
  .act-boing .p-foot.pf0{animation:kickL .9s ease-in-out infinite} .act-boing .p-foot.pf1{animation:kickR .9s ease-in-out infinite}
  .act-boing .shadow{animation:shadowleap .9s ease-in-out infinite}
  @keyframes frog{0%,100%{transform:none}22%{transform:scale(1.16,.84)}52%{transform:translateY(-18px) scale(.92,1.1)}80%{transform:scale(1.06,.94)}}
  @keyframes flapL{from{transform:rotate(-34deg)}to{transform:rotate(10deg)}}
  @keyframes flapR{from{transform:rotate(34deg)}to{transform:rotate(-10deg)}}
  @keyframes kickL{0%,30%,80%,100%{transform:none}52%{transform:translate(-6px,2px) rotate(-16deg)}}
  @keyframes kickR{0%,30%,80%,100%{transform:none}52%{transform:translate(6px,2px) rotate(16deg)}}
  /* Roki: dança remexendo o quadril, braços de discoteca e sapateado */
  .act-dance .msvg .whole{animation:groove 1s ease-in-out infinite}
  .act-dance .arm-l{animation:discoL 1s ease-in-out infinite} .act-dance .arm-r{animation:discoR 1s ease-in-out infinite}
  .act-dance .p-foot.pf0{animation:tap 1s ease-in-out infinite} .act-dance .p-foot.pf1{animation:tap 1s ease-in-out infinite -.5s}
  .act-dance .p-tail{animation:tailswing 1s ease-in-out infinite}
  @keyframes groove{0%,100%{transform:translateX(-4px) rotate(-5deg)}25%,75%{transform:translateY(-4px)}50%{transform:translateX(4px) rotate(5deg)}}
  @keyframes discoL{0%,100%{transform:rotate(0)}50%{transform:rotate(-95deg)}}
  @keyframes discoR{0%,100%{transform:rotate(95deg)}50%{transform:rotate(0)}}
  @keyframes tap{0%,40%,100%{transform:none}18%{transform:translateY(-8px) rotate(10deg)}}
  @keyframes tailswing{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-12deg)}}
  .acttxt{font-size:13px;font-weight:800;color:var(--accent);margin-top:2px}
  .streak-ov .bubble{display:inline-block;margin-top:10px}
  .week{display:flex;justify-content:center;gap:6px;margin:14px 0 6px}
  .week i{width:38px;height:48px;border-radius:12px;background:var(--card);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal;font-size:16px}
  .week i b{font-size:11px;color:var(--muted)}
  .week i.on{border-color:#F0A04B;background:#FFF1DF}
  .ins{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:9px 12px;margin-top:8px;text-align:left;font-weight:700;font-size:14px}
  .streak-ov .btn{margin-top:16px}
  .embers{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  .ember{position:absolute;bottom:-20px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle,#FFD27A,#FF7A2F);opacity:0;animation:rise linear infinite}
  .ember.big{width:auto;height:auto;background:none;font-size:20px}
  @keyframes rise{0%{transform:translateY(0) scale(1);opacity:0}10%{opacity:.95}100%{transform:translateY(-105vh) translateX(30px) scale(.4);opacity:0}}
  .infobox{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left}
  .infobox h4{margin:0 0 4px;font-family:"Baloo 2";font-size:19px;line-height:1.15}
  .infobox p{margin:0;font-size:14px;color:var(--muted);line-height:1.4}
  .infobox p b{color:var(--ink)}
  .infobox .btn{margin-top:10px}
  .brand b{font-family:"Baloo 2";font-size:34px;line-height:1}.brand b span{color:var(--accent)}
  .brand small{display:block;font-weight:900;color:var(--accent);letter-spacing:.04em}
  .brand em{display:block;font-style:normal;color:var(--muted);font-weight:700;font-size:14px}
  .chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:900;font-size:14px;white-space:nowrap}
  .chip.flag{font-size:18px;padding:2px 9px;line-height:1.3;cursor:pointer;font-family:inherit;color:inherit}
  .langs{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .lang{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer}
  .lang .fl{font-size:34px;line-height:1}.lang .grow{flex:1}.lang b{font-size:18px;display:block}.lang small{color:var(--muted);display:block;font-weight:700;font-size:13px}
  .lang.on{border-color:var(--accent)}.lang.off{opacity:.55;border-style:dashed;cursor:default}

  /* ----- início ----- */
  .hello{display:flex;align-items:center;gap:12px;margin:16px 16px 4px}
  .hello .mbox{width:92px;height:92px;cursor:pointer}
  .next{margin:14px 16px 0;background:var(--accent);color:#fff;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 5px 0 var(--accent-d);width:calc(100% - 32px);text-align:left}
  .next:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-d)}
  .next .ic{font-size:30px;width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
  .next small{display:block;font-weight:900;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
  .next b{font-size:19px;font-family:"Baloo 2";line-height:1.1}
  .next .g{font-size:14px;opacity:.92;display:block;margin-top:2px}
  .revbtn{margin:12px 16px 0;display:flex;gap:12px;align-items:center;width:calc(100% - 32px);text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 14px}
  .revbtn .n{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:20px}
  .revbtn b{display:block}.revbtn span{font-size:13px;color:var(--muted)}

  /* ----- mapa ----- */
  .block{margin:24px 16px 8px}
  .bhead{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px}
  .lvl{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--accent)}
  .bhead h2{font-size:24px;margin:6px 0 0;line-height:1.1}
  .bhead p{margin:2px 0 0;color:var(--muted);font-size:14px}
  .pbar{height:12px;background:var(--tint);border-radius:99px;overflow:hidden;margin-top:12px}
  .pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
  .pcount{font-size:13px;font-weight:800;color:var(--muted);margin-top:6px}
  .path{display:flex;flex-direction:column;align-items:center;gap:16px;padding:28px 0 6px}
  .node{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
  .node .c{width:72px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--accent);box-shadow:0 6px 0 var(--accent-d);transition:transform .1s}
  .node:active .c{transform:translateY(3px)}
  .node.done .c{background:var(--card);border:3px solid var(--accent);box-shadow:0 6px 0 var(--line2);color:var(--accent);font-weight:900}
  .node.locked .c{background:var(--tint);box-shadow:0 6px 0 var(--line2);font-size:22px}
  .node.locked{cursor:not-allowed}
  .node .lb{font-weight:800;font-size:14px;text-align:center;max-width:180px;line-height:1.15}
  .node .lb small{display:block;font-weight:700;color:var(--muted);font-size:12px}
  .node .st{font-size:13px;color:var(--accent);letter-spacing:1px;height:15px}
  .node .go{display:block;margin-bottom:4px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:2px 10px;font-weight:900;font-size:12px;color:var(--accent);letter-spacing:.08em;animation:bob 1.4s ease-in-out infinite}
  .node.cur .c{outline:4px solid var(--soft);outline-offset:4px}
  .soon{margin:12px 16px;display:flex;gap:14px;align-items:center;background:transparent;border:2px dashed var(--line2);border-radius:16px;padding:12px 14px;color:var(--muted)}
  .soon .e{font-size:24px;filter:grayscale(1);opacity:.6}
  .soon b{display:block;color:var(--ink);opacity:.7}
  .soon span{font-size:13px}

  /* ----- barra inferior ----- */
  .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:flex;background:var(--bg);border-top:2px solid var(--line);z-index:9;padding:6px 6px 10px}
  .nav button{flex:1;padding:7px 0;border-radius:12px;font-weight:900;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
  .nav button .i{font-size:21px;filter:grayscale(1);opacity:.55}
  .nav button .mi{width:26px;height:26px}
  .nav button.on{color:var(--accent);background:var(--soft)}
  .nav button.on .i{filter:none;opacity:1}

  /* ----- telas de painel ----- */
  .pad{padding:16px}
  .h1{font-size:28px;margin:4px 4px 12px;line-height:1.1}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px}
  .card b{display:block;font-size:24px;font-family:"Baloo 2";line-height:1.1}
  .card span{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
  .big{grid-column:1/-1;display:flex;align-items:center;gap:16px}
  .ring{width:84px;height:84px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:20px}
  .ring i{width:66px;height:66px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal}
  .chart{display:flex;align-items:flex-end;gap:8px;height:110px}
  .chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
  .chart i{width:100%;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:3px;opacity:.9}
  .chart small{font-size:11px;color:var(--muted);font-weight:800}
  .chart em{font-size:10px;font-style:normal;font-weight:900;color:var(--accent)}
  .list{display:flex;flex-direction:column;gap:8px;margin-top:8px}

  if (donePh.length) out.push(`🧠 Você já concluiu ${donePh.length} fase${donePh.length>1?"s":""} de raciocínio lógico.`);

}

let actx;
function tone(freqs){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  freqs.forEach((f,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type="sine"; o.frequency.value=f;
    const t=actx.currentTime+i*.09; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.14,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.22);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.25); }); }catch(e){} }
const sfx = {ok:()=>tone([660,880]), no:()=>tone([330,262]), tap:()=>tone([520]), win:()=>tone([523,659,784,1046])};
function speak(text){ return;  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang=CUR.lang; u.rate=.9; speechSynthesis.speak(u); }catch(e){} }

  const colors=[cs.getPropertyValue("--accent").trim(), cs.getPropertyValue("--mbody").trim(), "#D9D3C7", "#26241F"];
  for(let i=0;i<n;i++){ const d=document.createElement("div"); d.className="confetti"; d.style.left=Math.random()*100+"vw"; d.style.background=colors[i%colors.length];
    d.style.animationDuration=(1.6+Math.random()*1.6)+"s"; d.style.animationDelay=(Math.random()*.4)+"s"; document.body.appendChild(d); setTimeout(()=>d.remove(),3800); }
}

function unlocked(id){ const idx=MAIN_PHASES.findIndex(p=>p.id===id); return idx===0 || done(MAIN_PHASES[idx-1].id); }
function nextActivity(){

  return {type:"all"};
}

let L;
function startPhase(id){ const {p,b}=PHASES[id];
  L={mode:"phase", p, b, queue:p.questions.map((q,k)=>QUESTIONS[p.id+":"+k]), total:p.questions.length, n:0, mistakes:0, ok:0, xp:0}; learnCard(); }
function startReview(){
  const ids=shuffle(myReview()).slice(0,5);
  if(!ids.length){ toast("Nada para revisar agora 🎉"); return; }
  L={mode:"review", queue:ids.map(id=>QUESTIONS[id]), total:ids.length, n:0, mistakes:0, ok:0, xp:0, cleared:0}; nextQ();
}
function startChallenge(id){ const c=CH_BY_ID[id];
  const queue=shuffle(c.questions.map((q,k)=>QUESTIONS[c.id+":s"+k]));      // tudo novo: exercícios da expressão secreta
  const missed=shuffle(myReview().filter(id=>!id.startsWith(c.id+":")));
  const mine=missed.find(id=>QUESTIONS[id].from && PHASES[QUESTIONS[id].qid.split(":")[0]] && PHASES[QUESTIONS[id].qid.split(":")[0]].b===c.b) || missed[0];
  if (mine) queue.push({...QUESTIONS[mine], kind:"Revanche · "+(QUESTIONS[mine].kind||"Exercício")});   // algo que a pessoa já errou
  L={mode:"challenge", c, queue, total:queue.length, need:queue.length-1, revenge:!!mine, n:0, mistakes:0, ok:0, xp:0}; chalIntro(); }
/* teste de domínio: questões do bloco inteiro, misturadas, sem o cartão "Aprenda" antes */
function startMastery(id){ const b=MAIN.find(x=>x.id===id);
  const queue=shuffle(b.phases.flatMap(p=>shuffle(p.questions.map((q,k)=>QUESTIONS[p.id+":"+k])).slice(0,MASTERY_PER_PHASE)));
  L={mode:"mastery", b, queue, total:queue.length, need:Math.ceil(queue.length*MASTERY_PASS), n:0, mistakes:0, ok:0, xp:0};
  const m=S.mastery[b.id], won=mastered(b);
  app.innerHTML=`<div class="screen"><div class="end">${mbox("thinking")}
      <h2>Teste de domínio</h2><div class="sub">${b.emoji} ${esc(b.title)}</div>
      <div class="done-goal"><small>🎯 Como dominar o tópico</small>${L.total} questões de todas as fases do tópico, misturados e sem o cartão “Aprenda” antes. Acerte ${L.need} de ${L.total} (${Math.round(MASTERY_PASS*100)}%).</div>
      <div class="done-goal"><small>🎓 Por que existe</small>Você não sobe de nível só por concluir fases: sobe quando mostra que realmente domina o conteúdo.</div>
      ${won?`<div class="done-goal"><small>🏅 Tópico dominado</small>Melhor resultado: ${m.best}%. Faça de novo para manter o conteúdo fresco.</div>`:m&&m.plays?`<div class="done-goal"><small>📈 Sua melhor tentativa</small>${m.best}%</div>`:""}
    </div><div class="foot"><button class="btn" id="go" style="margin-bottom:10px">Começar o teste</button><button class="btn ghost" id="map">Agora não</button></div></div>`;
  sfx.tap();
  document.getElementById("go").onclick=()=>{ sfx.tap(); nextQ(); };
  document.getElementById("map").onclick=quit; window.scrollTo(0,0);
}
function finishMastery(){
  const b=L.b, acc=Math.round(L.ok/L.total*100), win=L.ok>=L.need, first=win && !mastered(b), lvBefore=level();
  const lines=[["Respostas certas",L.xp]];
  if (first) lines.push(["Tópico dominado",MASTERY_BONUS]);
  if (!win) lines.push(["Coragem de tentar",TRY_BONUS]);
  if (touchDay()) lines.push([`Sequência de ${S.streak} dia${S.streak>1?"s":""}`,5*Math.min(S.streak,7)]);
  const total=lines.reduce((s,l)=>s+l[1],0); addXP(total);
  const prev=S.mastery[b.id]||{plays:0,best:0};
  S.mastery[b.id]={passed:prev.passed||(win?dayStr():null), best:Math.max(prev.best||0,acc), plays:(prev.plays||0)+1};
  S.history.push({d:dayStr(), t:"Teste de domínio: "+b.title, c:L.ok, n:L.total, xp:total, lang:CUR.id}); S.history=S.history.slice(-40);
  const news=checkAch(); persist();
  const nx=nextActivity(), l=mascotLine(M(), win?"celebrate":"oops");
  app.innerHTML=`<div class="screen"><div class="end">${mbox(win?"celebrate":"encourage")}
      <h2>${win?(first?`Nível ${level()}!`:"Domínio confirmado!"):"Quase lá! 💪"}</h2><div class="sub">Teste de domínio · ${esc(b.title)}</div>
      <div class="bubble">${esc(l[0])}<small>${esc(l[1])}</small></div>
      <div class="cards3" style="margin-top:14px"><div class="card"><b>✔ ${L.ok}/${L.total}</b><span>Acertos</span></div><div class="card"><b>🎯 ${acc}%</b><span>Precisa ${Math.round(MASTERY_PASS*100)}%</span></div><div class="card"><b>⚡ ${total}</b><span>XP</span></div></div>
      ${first?`<div class="newach"><b>🏅 Tópico dominado: ${esc(b.title)}</b>Você subiu do nível ${lvBefore} para o nível ${level()}.</div>`:""}
      <div class="xpl">${lines.map(x=>`<div><span>${esc(x[0])}</span><b>+${x[1]} XP</b></div>`).join("")}</div>
      ${news.map(a=>`<div class="newach"><b>${a.e} Conquista: ${esc(a.t)}</b>${esc(a.d)}</div>`).join("")}
      ${win?"":`<p class="empty" style="margin-top:12px">Para dominar o tópico, acerte ${L.need} de ${L.total}. O que você errou foi para a <b>Revisão</b>: revise e tente de novo.</p>`}
    </div><div class="foot">
      ${win?"":`<button class="btn" id="again" style="margin-bottom:10px">Tentar de novo</button>`}
      ${win && nx.type!=="all"?`<button class="btn" id="nx" style="margin-bottom:10px">Continuar</button>`:""}
      <button class="btn ghost" id="map">Ver mapa</button></div></div>`;
  win ? (sfx.win(), confetti(first?130:60)) : sfx.tap();
  const a=document.getElementById("again"); if(a) a.onclick=()=>startMastery(b.id);
  const nb=document.getElementById("nx"); if(nb) nb.onclick=()=>goNext(nx);
  document.getElementById("map").onclick=quit; window.scrollTo(0,0);
}

function topBar(){ return `<div class="top"><button class="x" id="quit" aria-label="Sair">✕</button><div class="bar"><i style="width:${L.n/L.total*100}%"></i></div><div class="qcount">${Math.min(L.n+1,L.total)}/${L.total}</div></div>`; }

function readingHTML(blocks){
  return blocks.map(x=>{
    if (x.say){ const who=x.say[0]==="@"?M():null;
      return `<div class="say">${who?mbox("welcome",who):`<div class="av">${esc(x.say[0][0])}</div>`}<div class="bubble left">${esc(x.say[1])} <button class="spk" data-say="${esc(x.say[1])}" aria-label="Ouvir" style="width:26px;height:26px;font-size:12px;vertical-align:middle">🔊</button>${x.pt?`<small>${esc(x.pt)}</small>`:""}</div></div>`; }
    if (x.dialog) return dialogHTML(x.dialog);
    if (x.p)   return `<p>${x.p}</p>`;
    if (x.tip) return `<div class="tip">${x.tip}</div>`;
    if (x.ex)  return `<div class="ex"><button class="spk" data-say="${esc(x.ex)}" aria-label="Ouvir">🔊</button><div><span class="en">${esc(x.ex)}</span>${x.pt?`<span class="pt">${esc(x.pt)}</span>`:""}</div></div>`;
    return "";
  }).join("");
}
function learnCard(){
  const {p,b}=L, i=PHASES[p.id].i;
  app.innerHTML = `<div class="screen">${topBar()}<div class="page">
      <div class="kicker">${esc(b.title)} · Fase ${i+1} de ${b.phases.length}</div>

      <div class="goal"><span>🎯</span><span><small>Objetivo desta fase</small>${esc(p.goal)}</span></div>
      ${readingHTML(p.reading)}</div>

  document.getElementById("quit").onclick=quit;
  document.getElementById("go").onclick=()=>{ sfx.tap(); nextQ(); };

function nextQ(){
  if (!L.queue.length) return L.mode==="review"?finishReview():L.mode==="challenge"?finishChallenge():L.mode==="mastery"?finishMastery():finishPhase();
  const q=L.cur=L.queue.shift();
  app.innerHTML = `<div class="screen">${topBar()}<div class="q"><div class="qhead">
      <div class="type">${L.mode==="review"?"Revisão · ":L.mode==="challenge"?"Desafio · ":L.mode==="mastery"?"Teste de domínio · ":""}${esc(q.kind||{choice:"Escolha",build:"Monte a frase",match:"Associe"}[q.type])}</div><div class="qm">${mascotSVG(M(),"thinking")}</div></div>
      ${q.situation?`<div class="sit"><span>📍</span><span>${esc(q.situation)}</span></div>`:""}
      ${q.dialog?dialogHTML(q.dialog):""}
      <h3>${esc(q.prompt)}</h3><div id="body"></div></div>
    <div class="foot" id="foot"><div class="fb" id="fb"></div><button class="btn" id="check" disabled>Verificar</button></div></div>`;
  document.getElementById("quit").onclick=quit;
  ({choice:qChoice, build:qBuild, match:qMatch})[q.type](q);
  window.scrollTo(0,0);
}
function qChoice(q){
  const body=document.getElementById("body"), btn=document.getElementById("check");
  body.innerHTML=(q.sentence?`<div class="sent"><button class="spk" data-say="${esc(q.sentence.replace("___","…"))}">🔊</button><span>${esc(q.sentence)}</span></div>`:"")
    +`<div class="opts">${shuffle(q.options.map((o,i)=>i)).map(i=>`<button class="opt" data-i="${i}">${esc(q.options[i])}</button>`).join("")}</div>`;
  let sel=null; const opts=[...body.querySelectorAll(".opt")];
  opts.forEach(b=>b.onclick=()=>{ opts.forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel=+b.dataset.i; btn.disabled=false; sfx.tap(); });
  btn.onclick=()=>{ const ok=sel===q.answer; opts.forEach(x=>{ x.disabled=true; if(+x.dataset.i===q.answer) x.classList.add("good"); if(!ok&&+x.dataset.i===sel) x.classList.add("bad"); }); result(ok,q.options[q.answer]); };
}
function qBuild(q){
  const body=document.getElementById("body"), btn=document.getElementById("check");
  body.innerHTML=`<div class="slot" id="slot"></div><div class="bank">${shuffle(q.words).map(w=>`<button class="w">${esc(w)}</button>`).join("")}</div>`;
  const slot=body.querySelector("#slot"), picked=[];
  body.querySelectorAll(".bank .w").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("used")||btn.dataset.locked) return; b.classList.add("used"); sfx.tap();
    const c=document.createElement("button"); c.className="w"; c.textContent=b.textContent; slot.appendChild(c); picked.push({c,b});
    c.onclick=()=>{ if(btn.dataset.locked) return; c.remove(); b.classList.remove("used"); picked.splice(picked.findIndex(p=>p.c===c),1); btn.disabled=!picked.length; };
    btn.disabled=false; });
  btn.onclick=()=>{ btn.dataset.locked=1; result(norm(picked.map(p=>p.b.textContent).join(" "))===norm(q.answer), q.answer); };
}
function qMatch(q){
  const body=document.getElementById("body"), btn=document.getElementById("check");
  const left=shuffle(q.pairs.map((p,i)=>({t:p[0],i}))), right=shuffle(q.pairs.map((p,i)=>({t:p[1],i})));
  body.innerHTML=`<div class="pairs">${left.map((l,r)=>`<button class="opt" data-side="L" data-i="${l.i}">${esc(l.t)}</button><button class="opt" data-side="R" data-i="${right[r].i}">${esc(right[r].t)}</button>`).join("")}</div>`;
  btn.style.display="none"; let pick=null, matched=0, errs=0;
  body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("done")) return;
    if(b.dataset.side==="L") speak(b.textContent);
    if(!pick||pick.dataset.side===b.dataset.side){ if(pick) pick.classList.remove("sel"); pick=b; b.classList.add("sel"); sfx.tap(); return; }
    if(pick.dataset.i===b.dataset.i){ [pick,b].forEach(x=>{x.classList.remove("sel"); x.classList.add("done"); x.disabled=true;}); sfx.ok(); matched++;
      if(matched===q.pairs.length){ btn.style.display=""; result(errs===0,null); } }
    else { errs++; sfx.no(); const a=pick; [a,b].forEach(x=>{x.classList.remove("sel"); x.classList.add("bad","shake");}); setTimeout(()=>[a,b].forEach(x=>x.classList.remove("bad","shake")),450); }
    pick=null; });
}

/* cada exercício é respondido uma vez; erro vai para a Revisão (sem repetir na hora) */
function result(ok, correctText){
  const foot=document.getElementById("foot"), fb=document.getElementById("fb"), btn=document.getElementById("check"), q=L.cur;
  L.n++; S.stats.answered++;
  if (ok){
    S.stats.correct++; L.ok++;
    let gain=10;
    if (L.mode==="review"){ gain=8; S.stats.cleared++; L.cleared++; }
    delete S.review[q.qid];
    L.xp+=gain; L.row=(L.row||0)+1; foot.className="foot ok"; sfx.ok();
    const wow=L.row===3, l=mascotLine(M(),"happy");
    fb.innerHTML=`${mbox(wow?"surprised":"happy")}<div><span class="h">${wow?"3 seguidas! ":""}${esc(l[0])} +${gain} XP</span><span class="pt">${esc(l[1])}</span><p>${q.explain}</p></div>`;
  } else {
    L.mistakes++; L.row=0; S.review[q.qid]={n:((S.review[q.qid]||{}).n||0)+1, d:dayStr()};
    foot.className="foot no"; sfx.no();
    const l=mascotLine(M(),"sad");
    fb.innerHTML=`${mbox("encourage")}<div><span class="h">${esc(l[0])}</span><span class="pt">${esc(l[1])}</span>${correctText?`<p>Resposta certa: <b>${esc(correctText)}</b></p>`:""}<p>${q.explain}</p><p style="font-size:13px;color:var(--muted)">Errar faz parte: ela vai para a Revisão para você treinar.</p></div>`;
  }
  persist();
  document.querySelector(".bar i").style.width=(L.n/L.total*100)+"%";
  const pep = S.stats.answered % PEP_EVERY === 0;
  btn.disabled=false; btn.textContent="Continuar";
  btn.onclick=()=>{ sfx.tap(); pep ? pepTalk() : nextQ(); };
}

function pepTalk(){
  if ((S.stats.answered/PEP_EVERY)%2===0) return tipTalk();   // alterna: incentivo, dica, incentivo, dica…
  const l=mascotLine(M(),"encourage");
  app.innerHTML=`<div class="screen pep">${mbox("encourage")}
    <div class="bubble">${esc(l[0])}<small>${esc(l[1])}</small></div>
    <div class="meta">✍️ ${S.stats.answered} exercícios feitos · 🎯 ${accuracy()}% de acertos</div>
    <div class="foot"><button class="btn" id="go">Continuar</button></div></div>`;
  sfx.win(); document.getElementById("go").onclick=()=>{ sfx.tap(); nextQ(); };
}

function tipTalk(){
  const T=CUR.tips, n=S.tipBy[CUR.id]||0, tp=T[n%T.length]; S.tipBy[CUR.id]=n+1; persist();
  app.innerHTML=`<div class="screen pep">${mbox("happy")}
    <div class="kicker" style="margin-top:6px">💡 Dica de estudo</div>
    <div class="bubble tip"><span class="te">${tp.e}</span>${esc(tp.t)}<small>${esc(tp.d)}</small></div>
    <div class="meta">✍️ ${S.stats.answered} exercícios feitos · 🎯 ${accuracy()}% de acertos</div>
    <div class="foot"><button class="btn" id="go">Continuar</button></div></div>`;
  sfx.ok(); document.getElementById("go").onclick=()=>{ sfx.tap(); nextQ(); };
}

function addXP(n){ S.xp+=n; S.xpBy[CUR.id]=(S.xpBy[CUR.id]||0)+n; const t=dayStr(); S.days[t]=(S.days[t]||0)+n; }
const xpByTxt = ()=>S.langs.map(l=>`${COURSES[l].flag} ${S.xpBy[l]||0}`).join(" · ");

function finishPhase(){
  if (L.ok < Math.ceil(L.total*PASS)) return retryPhase();
  const {p,b}=L, first=!done(p.id);
  const stars=L.mistakes===0?3:L.mistakes===1?2:1, acc=Math.round(L.ok/L.total*100);
  const lines=[["Respostas certas",L.xp]];
  if (first) lines.push(["Fase concluída",20]);
  if (!L.mistakes) lines.push(["Sem erros",10]);
  if (touchDay()) lines.push([`Sequência de ${S.streak} dia${S.streak>1?"s":""}`,5*Math.min(S.streak,7)]);
  const prev=S.phases[p.id]||{stars:0,best:0,plays:0};
  S.phases[p.id]={stars:Math.max(prev.stars,stars), best:Math.max(prev.best,acc), plays:prev.plays+1};
  const blockNow = first && b.phases.every(x=>done(x.id));
  if (blockNow) lines.push(["Tópico completo!",100]);
  const total=lines.reduce((s,l)=>s+l[1],0); addXP(total);
  S.history.push({d:dayStr(), t:p.title, c:L.ok, n:L.total, xp:total, lang:CUR.id}); S.history=S.history.slice(-40);
  const news=checkAch(); persist();
  const nd=b.phases.filter(x=>done(x.id)).length, nx=nextActivity();
  const mood=blockNow?"celebrate":"excited", l=mascotLine(M(),mood);
  app.innerHTML=`<div class="screen"><div class="end">
      ${mbox(mood)}
      <h2>${blockNow?"Tópico completo!":"Fase concluída!"}</h2><div class="sub">${esc(p.title)} · ${esc(p.pt)}</div>
      <div class="bubble">${esc(l[0])}<small>${esc(l[1])}</small></div>
      <div class="st">${starsTxt(stars)}</div>
      <div class="cards3"><div class="card"><b>⚡ ${total}</b><span>XP</span></div><div class="card"><b>🎯 ${acc}%</b><span>Acertos</span></div><div class="card"><b>🔥 ${S.streak}</b><span>Dias</span></div></div>
      <div class="done-goal"><small>✔ Objetivo cumprido</small>${esc(p.goal)}</div>
      <div class="xpl">${lines.map(x=>`<div><span>${esc(x[0])}</span><b>+${x[1]} XP</b></div>`).join("")}</div>
      <div class="bprog"><div class="t">${b.emoji} ${esc(b.title)} · ${nd} de ${b.phases.length} fases</div>
        <div class="steps">${b.phases.map(x=>`<i class="${done(x.id)?"on":""}"></i>`).join("")}</div>
        <div class="n">${nd===b.phases.length?esc(b.doneMsg||"Tópico completo!"):`Falta${b.phases.length-nd>1?"m":""} ${b.phases.length-nd} fase${b.phases.length-nd>1?"s":""} para completar o tópico.`}</div></div>
      ${blockNow && !mastered(b) ? `<div class="newach"><b>🎓 Teste de domínio liberado!</b>Mostre que você domina o tópico e suba para o nível ${level()+1}.</div>`:""}
      ${news.map(a=>`<div class="newach"><b>${a.e} Conquista: ${esc(a.t)}</b>${esc(a.d)}</div>`).join("")}
      ${L.mistakes?`<p class="empty" style="margin-top:12px">O que você errou foi para a <b>Revisão</b>.${stars<3?" Refaça a fase sem erros para ganhar 3 estrelas.":""}</p>`:""}
    </div><div class="foot">
      ${nx.type!=="all"?`<button class="btn" id="nx" style="margin-bottom:10px">${nx.type==="phase"?`Próxima: ${esc(nx.p.title)}`:nx.type==="challenge"?"Próxima: Desafio surpresa":nx.type==="mastery"?"Próxima: Teste de domínio":"Próxima: Revisão"}</button>`:""}
      <button class="btn ghost" id="map">Ver mapa</button></div></div>`;
  sfx.win(); confetti(blockNow?130:60);
  const nb=document.getElementById("nx"); if(nb) nb.onclick=()=>goNext(nx);
  document.getElementById("map").onclick=quit; window.scrollTo(0,0);
}
function retryPhase(){
  const {p}=L, need=Math.ceil(L.total*PASS), acc=Math.round(L.ok/L.total*100);
  const bonus=touchDay()?5*Math.min(S.streak,7):0, total=L.xp+bonus+TRY_BONUS; addXP(total);
  const prev=S.phases[p.id]||{stars:0,best:0,plays:0};
  S.phases[p.id]={stars:prev.stars, best:Math.max(prev.best,acc), plays:prev.plays+1};
  S.history.push({d:dayStr(), t:p.title, c:L.ok, n:L.total, xp:total, lang:CUR.id}); S.history=S.history.slice(-40);
  checkAch(); persist();
  const l=mascotLine(M(),"oops");
  app.innerHTML=`<div class="screen"><div class="end">${mbox("encourage")}
      <h2>Você se jogou! 💪</h2><div class="sub">${esc(p.title)} · ${esc(p.pt)}</div>
      <div class="bubble">${esc(l[0])}<small>${esc(l[1])}</small></div>
      <div class="cards3" style="margin-top:14px"><div class="card"><b>✔ ${L.ok}/${L.total}</b><span>Acertos</span></div><div class="card"><b>🎯 ${need}</b><span>Para concluir</span></div><div class="card"><b>⚡ ${total}</b><span>XP ganho</span></div></div>
      <div class="xpl"><div><span>Coragem de tentar</span><b>+${TRY_BONUS} XP</b></div></div>
      <div class="done-goal"><small>🎯 Objetivo da fase</small>${esc(p.goal)}</div>
      <p class="empty" style="margin-top:12px">Errar aqui é melhor do que errar na prova. Com ${need} acertos de ${L.total}, a fase é sua. O que você errou virou Revisão para treinar.</p>
    </div><div class="foot"><button class="btn" id="again" style="margin-bottom:10px">Jogar de novo</button><button class="btn ghost" id="map">Ver mapa</button></div></div>`;
  sfx.tap();
  document.getElementById("again").onclick=()=>startPhase(p.id);
  document.getElementById("map").onclick=quit; window.scrollTo(0,0);
}

function finishChallenge(){
  const c=L.c, pr=PRIZES[c.prize], win=L.ok>=L.need, first=win && !chalWon(c);
  const lines=[["Respostas certas",L.xp]];
  if (first) lines.push(["Desafio vencido",CHAL_BONUS]);
  if (!win) lines.push(["Coragem de tentar",TRY_BONUS]);
  if (touchDay()) lines.push([`Sequência de ${S.streak} dia${S.streak>1?"s":""}`,5*Math.min(S.streak,7)]);
  const total=lines.reduce((s,l)=>s+l[1],0); addXP(total);
  const prev=S.challenges[c.id]||{plays:0};
  S.challenges[c.id]={won:prev.won||(win?dayStr():null), plays:(prev.plays||0)+1};
  if (first && !S.items.includes(c.prize)) S.items.push(c.prize);
  S.history.push({d:dayStr(), t:"Desafio: "+c.title, c:L.ok, n:L.total, xp:total, lang:CUR.id}); S.history=S.history.slice(-40);
  const news=checkAch(); persist();
  const xpl=`<div class="xpl">${lines.map(x=>`<div><span>${esc(x[0])}</span><b>+${x[1]} XP</b></div>`).join("")}</div>`;
  if (!win){
    const l=mascotLine(M(),"oops");
    app.innerHTML=`<div class="screen"><div class="end">${mbox("encourage")}
        <h2>Você se jogou! 💪</h2><div class="sub">Desafio surpresa · ${esc(c.title)}</div>
        <div class="bubble">${esc(l[0])}<small>${esc(l[1])}</small></div>
        <div class="cards3" style="margin-top:14px"><div class="card"><b>✔ ${L.ok}/${L.total}</b><span>Acertos</span></div><div class="card"><b>🎯 ${L.need}</b><span>Para abrir</span></div><div class="card"><b>⚡ ${total}</b><span>XP ganho</span></div></div>
        ${xpl}
        <p class="empty" style="margin-top:12px">Você já aprendeu a expressão secreta, e ela é sua. O presente continua te esperando: cada tentativa traz exercícios novos.</p>
      </div><div class="foot"><button class="btn" id="again" style="margin-bottom:10px">Jogar de novo</button><button class="btn ghost" id="map">Ver mapa</button></div></div>`;
    sfx.tap();
    document.getElementById("again").onclick=()=>startChallenge(c.id);
    document.getElementById("map").onclick=quit; window.scrollTo(0,0); return;
  }
  const using=S.profile.accessories.includes(c.prize), l=mascotLine(M(),"gift");
  app.innerHTML=`<div class="screen"><div class="end">
      <div class="mbox">${mascotSVG(M(),"excited",{accessories:withItem(c.prize)})}</div>
      <h2>${first?"Presente aberto!":"Desafio vencido!"}</h2><div class="sub">Desafio surpresa · ${esc(c.title)}</div>
      <div class="bubble">${esc(l[0])}<small>${esc(l[1])}</small></div>
      <div class="prize"><span class="pe">${pr.e}</span><div><small>${first?"Novo item para o seu mascote":"Item já conquistado"}</small><b>${esc(pr.name)}</b></div></div>
      ${xpl}
      ${news.map(a=>`<div class="newach"><b>${a.e} Conquista: ${esc(a.t)}</b>${esc(a.d)}</div>`).join("")}
      ${L.mistakes?`<p class="empty" style="margin-top:12px">O que você errou foi para a <b>Revisão</b>.</p>`:""}
    </div><div class="foot">
      ${using?"":`<button class="btn" id="use" style="margin-bottom:10px">Usar agora</button>`}
      <button class="btn ${using?"":"ghost"}" id="map">Ver mapa</button></div></div>`;
  sfx.win(); confetti(first?110:60);
  const u=document.getElementById("use"); if(u) u.onclick=()=>{ equip(c.prize); sfx.ok(); toast(`${pr.e} Seu mascote está usando: ${pr.name}`); quit(); };
  document.getElementById("map").onclick=quit; window.scrollTo(0,0);
}
function finishReview(){
  const bonus=touchDay()?5*Math.min(S.streak,7):0, total=L.xp+bonus; addXP(total);
  S.history.push({d:dayStr(), t:"Revisão", c:L.ok, n:L.total, xp:total, lang:CUR.id}); S.history=S.history.slice(-40);
  const news=checkAch(); persist();
  const left=myReview().length, l=mascotLine(M(),"excited");
  app.innerHTML=`<div class="screen"><div class="end">${mbox("excited")}
      <h2>Revisão feita!</h2><div class="sub">Você reforçou ${L.cleared} de ${L.total} item(ns)</div>
      <div class="bubble">${esc(l[0])}<small>${esc(l[1])}</small></div>
      <div class="cards3" style="margin-top:14px"><div class="card"><b>⚡ ${total}</b><span>XP</span></div><div class="card"><b>🎯 ${Math.round(L.ok/L.total*100)}%</b><span>Acertos</span></div><div class="card"><b>📌 ${left}</b><span>Restam</span></div></div>
      ${bonus?`<div class="xpl"><div><span>Sequência de ${S.streak} dia(s)</span><b>+${bonus} XP</b></div></div>`:""}
      ${news.map(a=>`<div class="newach"><b>${a.e} Conquista: ${esc(a.t)}</b>${esc(a.d)}</div>`).join("")}
    </div><div class="foot"><button class="btn" id="map">Voltar ao mapa</button></div></div>`;
  sfx.win(); confetti(); document.getElementById("map").onclick=quit;
}

render();
</script>
</body>
</html>
